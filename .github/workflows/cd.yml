name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

  build-e-deploy:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar build de producao
        run: npm run build

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
