name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test
